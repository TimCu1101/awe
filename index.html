<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設備借還管理系統</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 560px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 0 0 22px;
    }

    h2 {
      font-size: 19px;
      margin-top: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .mode-buttons button {
      flex: 1;
      background: #e2e8f0;
      color: #334155;
    }

    .mode-buttons button.active.borrow {
      background: #2563eb;
      color: white;
    }

    .mode-buttons button.active.return {
      background: #16a34a;
      color: white;
    }

    #startButton {
      width: 100%;
      margin-top: 16px;
      color: white;
      background: #334155;
    }

    #stopButton {
      width: 100%;
      margin-top: 8px;
      color: white;
      background: #64748b;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 10px;
    }

    .info {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #f8fafc;
      line-height: 1.9;
      display: none;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 9px;
      display: none;
      line-height: 1.7;
      white-space: pre-line;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      line-height: 1.7;
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    .history-title {
      font-weight: bold;
      font-size: 15px;
    }

    .refresh-button {
      width: 100%;
      margin-top: 10px;
      background: #e2e8f0;
      color: #334155;
    }

    .hint {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>設備借還管理系統</h1>

    <label for="personName">借用人／歸還人姓名</label>
    <input
      id="personName"
      type="text"
      placeholder="請輸入姓名"
      maxlength="40"
      autocomplete="name"
    >

    <label>操作模式</label>
    <div class="mode-buttons">
      <button id="borrowMode" class="active borrow" type="button">
        借用設備
      </button>
      <button id="returnMode" type="button">
        歸還設備
      </button>
    </div>

    <button id="startButton" type="button">
      開啟 QR Code 掃描
    </button>

    <button id="stopButton" type="button" disabled>
      停止掃描
    </button>

    <div id="reader"></div>

    <div id="equipmentInfo" class="info">
      <strong>設備資訊</strong>
      <div id="equipmentDetails"></div>
    </div>

    <div id="result" class="result"></div>

    <h2>最近借還紀錄</h2>
    <div id="history">
      <p class="hint">正在載入紀錄……</p>
    </div>

    <button id="refreshButton" class="refresh-button" type="button">
      重新整理紀錄
    </button>

    <p class="hint">
      使用前請先輸入姓名，再選擇借用或歸還模式。
      掃描成功後，系統會自動更新設備狀態及紀錄。
    </p>
  </main>

  <script>
    // 請替換成自己的 GAS Web App 部署網址
    const API_URL =
      "請替換成你的_GAS_Web_App_網址";

    let currentAction = "borrow";
    let scanner = null;
    let scanning = false;
    let busy = false;
    let callbackNumber = 0;
    let lastScannedId = "";

    const $ = id => document.getElementById(id);

    const borrowMode = $("borrowMode");
    const returnMode = $("returnMode");
    const startButton = $("startButton");
    const stopButton = $("stopButton");
    const resultBox = $("result");

    /**
     * 顯示訊息
     */
    function showResult(message, type) {
      resultBox.textContent = message;
      resultBox.className = "result " + type;
      resultBox.style.display = "block";
    }

    /**
     * 隱藏設備資訊
     */
    function hideEquipmentInfo() {
      $("equipmentInfo").style.display = "none";
    }

    /**
     * 顯示設備資訊
     */
    function showEquipmentInfo(id, name, brand) {
      const details = $("equipmentDetails");

      details.textContent =
        "設備編號：" + id +
        "\n設備名稱：" + name +
        "\n廠牌：" + brand;

      $("equipmentInfo").style.display = "block";
    }

    /**
     * 呼叫 GAS JSONP API
     */
    function callAPI(params) {
      return new Promise((resolve, reject) => {
        if (!API_URL.startsWith("https://script.google.com/")) {
          reject(new Error("請先設定正確的 GAS Web App 網址。"));
          return;
        }

        const callbackName =
          "gasCallback_" + Date.now() + "_" + (++callbackNumber);

        const script = document.createElement("script");
        const query = new URLSearchParams(params);

        query.set("callback", callbackName);

        let finished = false;

        const timeout = setTimeout(() => {
          finish();
          reject(new Error("連線逾時，請檢查網路或 GAS 部署設定。"));
        }, 20000);

        function finish() {
          if (finished) return;
          finished = true;

          clearTimeout(timeout);
          script.remove();
          delete window[callbackName];
        }

        window[callbackName] = data => {
          finish();
          resolve(data);
        };

        script.onerror = () => {
          finish();
          reject(new Error("無法連接 GAS，請確認部署網址及權限。"));
        };

        script.src = API_URL + "?" + query.toString();
        document.body.appendChild(script);
      });
    }

    /**
     * 切換借用／歸還模式
     */
    function setMode(action) {
      if (busy) return;

      currentAction = action;

      borrowMode.className =
        action === "borrow" ? "active borrow" : "";

      returnMode.className =
        action === "return" ? "active return" : "";

      hideEquipmentInfo();

      showResult(
        action === "borrow"
          ? "目前模式：借用設備"
          : "目前模式：歸還設備",
        "loading"
      );
    }

    borrowMode.addEventListener("click", () => {
      setMode("borrow");
    });

    returnMode.addEventListener("click", () => {
      setMode("return");
    });

    /**
     * QR Code 掃描成功
     */
    async function onScanSuccess(decodedText) {
      if (busy) return;

      const personName = $("personName").value.trim();

      if (!personName) {
        showResult("請先輸入姓名，再掃描設備。", "error");
        return;
      }

      // QR Code 內容預期為設備編號，例如 1001
      const equipmentId = decodedText.trim();

      if (!/^\d+$/.test(equipmentId)) {
        showResult(
          "QR Code 內容不是有效的設備編號：" + equipmentId,
          "error"
        );
        return;
      }

      busy = true;
      lastScannedId = equipmentId;

      startButton.disabled = true;

      showResult("正在處理設備 " + equipmentId + "……", "loading");

      try {
        const response = await callAPI({
          action: currentAction,
          id: equipmentId,
          name: personName
        });

        if (!response.success) {
          showResult(response.message || "操作失敗。", "error");
          return;
        }

        showEquipmentInfo(
          response.id,
          response.equipmentName,
          response.brand
        );

        const actionText =
          response.action === "borrow" ? "借用成功" : "歸還成功";

        showResult(
          actionText +
          "\n設備編號：" + response.id +
          "\n設備名稱：" + response.equipmentName +
          "\n廠牌：" + response.brand +
          "\n操作人：" + response.person +
          "\n時間：" + response.time +
          "\n目前狀態：" + response.status,
          "success"
        );

        await loadHistory();

      } catch (error) {
        showResult(error.message, "error");

      } finally {
        busy = false;
        startButton.disabled = false;
      }
    }

    /**
     * 開啟相機
     */
    async function startScanner() {
      if (scanning) return;

      if (!API_URL.startsWith("https://script.google.com/")) {
        showResult("https://script.google.com/macros/s/AKfycbwJe1r7O5Ufvbf2-Q2Wa3wgys9zGF_Wb08tky0MARuJv99jmKWscaicppOmvmmwL61Y/exec", "error");
        return;
      }

      if (!$("personName").value.trim()) {
        showResult("請先輸入借用人姓名。", "error");
        $("personName").focus();
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        showResult("QR Code 掃描程式載入失敗。", "error");
        return;
      }

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess,
          () => {}
        );

        scanning = true;
        startButton.disabled = true;
        stopButton.disabled = false;

        showResult("相機已啟動，請對準設備 QR Code。", "loading");

      } catch (error) {
        scanner = null;

        showResult(
          "無法啟動相機，請確認已允許相機權限，並使用 HTTPS 網頁。",
          "error"
        );
      }
    }

    /**
     * 停止相機
     */
    async function stopScanner() {
      if (!scanner || !scanning) return;

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (error) {
        console.error(error);
      }

      scanner = null;
      scanning = false;

      startButton.disabled = false;
      stopButton.disabled = true;
    }

    startButton.addEventListener("click", startScanner);
    stopButton.addEventListener("click", stopScanner);

    /**
     * 取得借還紀錄
     */
    async function loadHistory() {
      const historyBox = $("history");

      try {
        const response = await callAPI({
          action: "history"
        });

        if (!response.success) {
          throw new Error(response.message || "讀取紀錄失敗。");
        }

        historyBox.replaceChildren();

        if (!response.records.length) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "目前沒有借還紀錄。";
          historyBox.appendChild(empty);
          return;
        }

        response.records.forEach(record => {
          const item = document.createElement("div");
          item.className = "history-item";

          const title = document.createElement("div");
          title.className = "history-title";
          title.textContent =
            record.equipmentName + "（" + record.id + "）";

          const details = document.createElement("div");

          details.textContent =
            "廠牌：" + record.brand +
            "\n借用人：" + record.borrower +
            "\n借用時間：" + record.borrowTime +
            "\n歸還人：" + (record.returner || "尚未歸還") +
            "\n歸還時間：" + (record.returnTime || "尚未歸還");

          item.appendChild(title);
          item.appendChild(details);

          historyBox.appendChild(item);
        });

      } catch (error) {
        historyBox.textContent = error.message;
      }
    }

    $("refreshButton").addEventListener("click", loadHistory);

    // 頁面載入時讀取紀錄
    loadHistory();
  </script>
</body>
</html>
